{% extends "admin/change_form.html" %}


{% block after_field_sets %}

<script>
document.addEventListener("DOMContentLoaded", function () {

    const titleInput = document.querySelector("#id_title");

    if (!titleInput) {
        return;
    }

    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "🤖 Generate Blog";
    button.style.marginLeft = "10px";
    button.className = "default";

    button.onclick = async function () {

        const topic = titleInput.value.trim();

        if (!topic) {
            alert("Enter blog topic first");
            return;
        }

        button.disabled = true;
        button.textContent = "Generating… (this can take a few minutes)";

        try {
            const response = await fetch("{% url 'admin:blogs_blog_generate' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ topic: topic })
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.error || "Blog generation failed.");
                return;
            }

            document.querySelector("#id_title").value = data.title;
            document.querySelector("#id_content").value = data.content;

            const description = document.querySelector("#id_short_description");
            if (description) {
                description.value = data.meta;
            }

        } catch (error) {
            alert("Blog generation failed. Please try again.");
        } finally {
            button.disabled = false;
            button.textContent = "🤖 Generate Blog";
        }
    };

    titleInput.parentElement.appendChild(button);

});
</script>


{% endblock %}
