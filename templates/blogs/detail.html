<!DOCTYPE html>

<html>

<head>

<title>
{{ blog.title }}
</title>

</head>


<body>


<h1>
{{ blog.title }}
</h1>


{% if blog.image %}

<img 
src="{{ blog.image.url }}"
width="500">

{% endif %}


<p>
{{ blog.created_at }}
</p>


<div>

{{ blog.content|safe }}

</div>


<a href="{% url 'blog_list' %}">
Back to Blogs
</a>


</body>

</html>
