# Reverse proxy in front of gunicorn.
#
# TLS: terminate HTTPS here (e.g. certbot) or at a load balancer in front.
# If a load balancer terminates TLS, it must send X-Forwarded-Proto, which is
# passed through below so Django knows the original request was HTTPS.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream django {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # User uploads (blog images). Static files are served by WhiteNoise.
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # AI blog generation in the admin can take minutes (matches gunicorn).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
